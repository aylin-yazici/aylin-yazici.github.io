<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melon Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
  :root{
    color-scheme: light;
    --sky:#3EA5FD; --sky-light:#5BB8FF; --blue:#1E5FD8; --blue-deep:#154AB0;
    --cream:#FAE6D6; --sun:#FFC83A; --sun-deep:#E09A12;
  }
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; user-select:none; -webkit-user-select:none;
    font-family:"Lilita One",system-ui,sans-serif; color:var(--blue);
    background-color:var(--sky);
    background-image:
      linear-gradient(45deg,var(--sky-light) 25%,transparent 25%,transparent 75%,var(--sky-light) 75%),
      linear-gradient(45deg,var(--sky-light) 25%,transparent 25%,transparent 75%,var(--sky-light) 75%);
    background-size:140px 140px; background-position:0 0,70px 70px;
  }
  #stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
  #frame{position:relative;box-shadow:0 0 40px rgba(10,40,110,.35)}
  canvas{display:block;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #end{position:absolute;inset:0;display:grid;place-items:center;background:rgba(12,45,120,.5);padding-inline:16px}
  #end[hidden]{display:none}
  #end .card{
    background:var(--cream);border:6px solid var(--blue);border-radius:30px;
    padding:24px 22px 20px;text-align:center;width:min(300px,100%);
    box-shadow:0 10px 0 var(--blue-deep);animation:rise .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  #end .fruit{display:flex;justify-content:center;gap:10px;height:40px;align-items:center}
  #end .fruit img{height:34px;width:auto}
  #end h2{font-weight:400;font-size:40px;line-height:1.05;margin:8px 0 6px;color:#fff;letter-spacing:1px;
    -webkit-text-stroke:7px var(--blue);paint-order:stroke fill;text-wrap:balance}
  #end.fail h2{-webkit-text-stroke-color:#C8322B}
  #end p{margin:0 0 18px;font-size:17px;color:var(--blue);text-wrap:balance}
  #primary{
    font-family:inherit;font-size:24px;letter-spacing:.5px;color:#fff;cursor:pointer;
    border:0;border-radius:20px;padding:14px 36px;background:#43C94B;box-shadow:0 6px 0 #22912B;
    -webkit-text-stroke:5px #1D7A25;paint-order:stroke fill;
  }
  #primary:active{transform:translateY(3px);box-shadow:0 3px 0 #22912B}
  #secondary{display:block;margin:12px auto 0;font-family:inherit;font-size:18px;color:var(--blue);background:none;border:0;cursor:pointer;padding:6px 12px}
  #primary:focus-visible,#secondary:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
  @keyframes rise{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion: reduce){#end .card{animation:none}}
</style>
</head>

      if (q.vx !== undefined) { q.vy += 900 * dt; q.x += q.vx * dt; q.y += q.vy * dt; if (q.vr) q.rot += q.vr * dt; }
    }
    particles = particles.filter(q => q.age < q.life);
    for (const f of flyers) {
      f.t += dt / f.dur;
      if (f.t < 1 || f.done) continue;
      f.done = true;
      if (f.kind === 'heart') {
        S.lives = Math.min(MAX_LIVES, S.lives + 1); heartFx[S.lives - 1] = 1; SFX.life();
        const [x, y] = heartPos(S.lives - 1);
        for (let j = 0; j < 5; j++) { const a = Math.random() * TAU, v = 50 + Math.random() * 80;
          sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 5 + Math.random() * 3, age: 0, life: .5 + Math.random() * .3, rot: Math.random() * 3, color: '#FF8A8A' }); }
        continue;
      }
      S.left[f.fruit] = Math.max(0, S.left[f.fruit] - 1); hudBump[f.fruit] = 1; hudFlash = 1;
      SFX.tick(f.i, Math.min(f.combo - 1, 3));
      for (let j = 0; j < 3; j++) { const a = Math.random() * TAU, v = 60 + Math.random() * 90;
        sparks.push({ x: goalX(f.fruit), y: GOAL_ICON_Y + 8, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 5 + Math.random() * 4, age: 0, life: .5 + Math.random() * .3, rot: Math.random() * 3 }); }
      if (f.i === 5) SFX.reward(f.combo);
    }
    flyers = flyers.filter(f => !f.done);

    // stage flow
    S.phaseT += dt;
    const st = cfg();
    if (S.phase === 'in') {
      S.plates.forEach(p => p.enter = clamp01((S.phaseT - .15 - p.delay) / .55));
      if (S.phaseT > 1.25) {
        if (st.livesIntro && !S.livesShown) { S.livesShown = true; S.phase = 'lives'; S.phaseT = 0; SFX.life(); }
        else { S.phase = 'play'; S.phaseT = 0; spawnPiece(); }
      }
    } else if (S.phase === 'lives') {
      if (S.phaseT > .3 && S.phaseT < 1.2 && Math.floor((S.phaseT - .25) / .09) !== Math.floor((S.phaseT - .25 - dt) / .09)) tone({ f0: 500 + S.phaseT * 400, dur: .08, vol: .06 });
    } else if (S.phase === 'play') {
      if (fruitsOf(st).every(f => S.left[f] === 0) && !flyers.length && !fly && !S.plates.some(p => p.pop) && !note) {
        S.phase = 'clear'; S.phaseT = 0; S.piece = null; SFX.banner();
      }
    } else if (S.phase === 'clear') {
      if (S.phaseT > .9) {
        if (S.stage === STAGES.length - 1) { endStage('win'); }
        else { S.phase = 'out'; S.phaseT = 0; SFX.whoosh(false); }
      }
    } else if (S.phase === 'out') {
      S.plates.forEach(p => p.exit = clamp01((S.phaseT - p.delay) / .45));
      if (S.phaseT > .8) setupStage(S.stage + 1);
    } else if (S.phase === 'over' && endEl.hidden && S.phaseT > (S.endKind === 'win' ? .5 : 1.1)) {
      showEnd(S.endKind);
      if (S.endKind === 'win') SFX.win(); else SFX.fail();
    }
  }

  function renderMenu() {
    ctx.drawImage(A.menuBg, 0, 0, W, H);
    ctx.drawImage(A.topbar, TOPBAR.x, TOPBAR.y);
    const b = LEVEL_BTN, s = 1 - btnPress * .06;
    ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(s, s); ctx.drawImage(A.levelBtn, -b.w / 2, -b.h / 2); ctx.restore();
  }

  function renderGame() {
    const st = cfg();
    drawBackground();
    drawHud();
    drawHearts();
    drawLocks();
    ctx.drawImage(A.gen, GEN_TL[0], GEN_TL[1]);
    S.plates.forEach(drawPlate);

    if (S.piece) {
      const s = back(S.pieceIn), wob = S.phase === 'over' && S.endKind === 'moves' ? Math.sin(t * 18) * .06 * Math.max(0, 1 - S.phaseT) : 0;
      ctx.save(); ctx.translate(GEN.x, GEN.y); ctx.scale(s, s); ctx.rotate(wob);
      drawPiece(S.piece, 0, 0);
      ctx.restore();
    }

    for (const q of particles) {
      const k = q.age / q.life;
      ctx.globalAlpha = 1 - k * k;
      if (q.kind === 'sprite') {
        const [sx, sy, sw, sh] = q.src;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.scale(q.s, q.s);
        ctx.drawImage(A[q.sheet], sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh); ctx.restore();
      } else if (q.kind === 'wedge') { drawSlice(q.x, q.y, q.fruit, q.i, 1 - k * .4); }
      else if (q.kind === 'ring') { ctx.globalAlpha = (1 - k) * .85; ctx.beginPath(); ctx.arc(q.x, q.y, PLATE_R + ease(k) * 60, 0, TAU); ctx.strokeStyle = '#fff'; ctx.lineWidth = 9 * (1 - k); ctx.stroke(); }
      else if (q.kind === 'reward') drawReward(q, k);
      else if (q.kind === 'float') { ctx.globalAlpha = 1 - k; outlined(q.text, q.x, q.y + ease(k) * 16, 20, q.color, '#7A1512', '#4A0C0A'); }
      ctx.globalAlpha = 1;
    }

    for (const f of flyers) {
      if (f.t < 0) continue;
      const k = ease(f.t);
      const [tx, ty] = f.kind === 'heart' ? heartPos(f.slot) : [goalX(f.fruit), GOAL_ICON_Y];
      const cx = (f.x0 + tx) / 2 + (f.kind === 'heart' ? 0 : (f.i - 2.5) * 28), cy = Math.min(f.y0, ty) - 60;
      const x = (1 - k) * (1 - k) * f.x0 + 2 * (1 - k) * k * cx + k * k * tx;
      const y = (1 - k) * (1 - k) * f.y0 + 2 * (1 - k) * k * cy + k * k * ty;
      if (f.kind === 'heart') {
        const s = HEARTS.s * (1.8 - k * .8) * (f.t < .15 ? back(f.t / .15) : 1);
        ctx.save(); ctx.globalAlpha = .6; star(x, y + 4, 14 * (1 - k), k * 6, '#FFC2C2'); ctx.restore();
        ctx.save(); ctx.translate(x, y); ctx.scale(s, s); ctx.drawImage(A.heartFull, -A.heartFull.width / 2, -A.heartFull.height / 2); ctx.restore();
        continue;
      }
      const im = A[ICONS[f.fruit]];
      ctx.save(); ctx.globalAlpha = .5; star(x, y + 6, 12 * (1 - k), k * 6, '#FFF3B0'); ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate((1 - k) * 3); ctx.scale(1.4 - k * .4, 1.4 - k * .4); ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore();
    }
    for (const q of sparks) star(q.x, q.y, q.r * (1 - q.age / q.life), q.rot + q.age * 5, q.color);

    if (fly) {
      const k = ease(fly.t), a = Math.sin(k * Math.PI);
      const x = GEN.x + (fly.p.x - GEN.x) * k, y = GEN.y + (fly.p.y - GEN.y) * k - a * 25;
      ctx.save(); ctx.translate(x, y); ctx.scale(1 + a * .12, 1 + a * .12);
      ctx.shadowColor = 'rgba(10,40,110,.4)'; ctx.shadowOffsetY = 10; ctx.shadowBlur = 12;
      drawPiece(fly.piece, 0, 0);
      ctx.restore();
    }

    // hand: shows the plate to tap (tutorial right away, later only after a pause)
    if (S.phase === 'play' && S.piece && S.pieceIn >= 1 && !fly && idle > st.hintDelay && !S.piece.spot && !S.piece.demoWrong && !(note && note.hold)) {
      const tgt = hintPlate(S.piece);
      if (tgt) drawHintHand(tgt, st);
    }

    // tutorial tip for the current piece (first step also spotlights the plate and the generator)
    const tipPiece = S.piece || (fly && fly.piece);
    if (S.phase === 'play' && tipPiece && tipPiece.tip && S.piece && !(note && note.hold)) {
      const tgt = hintPlate(S.piece), a = clamp01(S.pieceIn * 2);
      if (S.piece.spot && tgt) {
        spotlight([{ x: tgt.x, y: tgt.y, r: PLATE_R + 8 }, { x: GEN.x, y: GEN.y, r: PLATE_R + 8 }], a);
        S.plates.filter(p => p === tgt).forEach(drawPlate);
        ctx.drawImage(A.gen, GEN_TL[0], GEN_TL[1]);
        ctx.save(); ctx.translate(GEN.x, GEN.y); drawPiece(S.piece, 0, 0); ctx.restore();
      }
      drawBubble(S.piece.tip, W / 2, 648, { alpha: a, pop: back(clamp01(S.pieceIn * 1.5)) });
      if ((S.piece.spot || S.piece.demoWrong) && tgt && idle > st.hintDelay) drawHintHand(tgt, st);
    }
    // lives introduction: dim everything but the hearts
    if (S.phase === 'lives') {
      const a = clamp01(S.phaseT * 3), x0 = heartPos(0)[0] - 20, x1 = heartPos(MAX_LIVES - 1)[0] + 20;
      spotlight([{ x: x0, y: HEARTS.y - 20, w: x1 - x0, h: 40 }], a);
      drawHearts();
      drawBubble(`These are your lives. You have ${MAX_LIVES}!`, W / 2, HEARTS.y + 34,
        { tail: -1, tx: W / 2, alpha: clamp01((S.phaseT - .5) * 3), pop: back(clamp01((S.phaseT - .5) * 3)) });
      if (S.phaseT > 1.1) { ctx.save(); ctx.globalAlpha = .6 + .4 * Math.sin(t * 5); outlined('Tap to continue', W / 2, 330, 20, '#fff'); ctx.restore(); }
    }
    if (note && note.age > 0 && S.phase !== 'lives') {
      const end = note.hold ? 3.6 : 3.2, a = Math.min(1, note.age * 5, (end - note.age) * 3);
      if (note.spot) {
        const x0 = heartPos(0)[0] - 20, x1 = heartPos(MAX_LIVES - 1)[0] + 20;
        spotlight([{ x: x0, y: HEARTS.y - 20, w: x1 - x0, h: 40 }], a);
        drawHearts();
      }
      drawBubble(note.text, W / 2, HEARTS.y + 34, { tail: -1, tx: W / 2, alpha: a, pop: back(clamp01(note.age * 4)) });
    }

    // stage banner
    if (S.phase === 'in' || S.phase === 'clear') {
      const text = S.phase === 'in' ? st.intro : (S.stage === STAGES.length - 1 ? 'Level clear!' : ['Great!', 'Awesome!', 'Perfect!'][S.stage % 3]);
      const k = S.phaseT, inK = back(clamp01(k * 3.5)), out = S.phase === 'in' ? clamp01((k - 1) * 5) : clamp01((k - .7) * 5);
      ctx.save(); ctx.globalAlpha = 1 - out; ctx.translate(W / 2, S.phase === 'in' ? 300 : GEN.y); ctx.scale(inK, inK);
      if (S.phase === 'in' && st.newFruit) {
        const im = A[ICONS[st.newFruit]]; ctx.save(); ctx.translate(0, -44); ctx.rotate(Math.sin(t * 4) * .1); ctx.scale(2.2, 2.2); ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore();
      }
      outlined(text, 0, 0, 38, S.phase === 'clear' ? '#FFD23F' : '#fff');
      ctx.restore();
    }

    if (S.phase === 'over' && S.endKind !== 'win') {
      const k = Math.min(1, S.phaseT * 4);
      ctx.save(); ctx.fillStyle = `rgba(12,45,120,${.3 * k})`; ctx.fillRect(0, 0, W, H);
      ctx.translate(W / 2, GEN.y); ctx.scale(back(k), back(k));
      outlined(S.endKind === 'lives' ? 'No lives left!' : 'No moves left!', 0, 0, 40, '#fff', '#C8322B', '#7A1512');
      ctx.restore();
    }
    if (redFlash) {
      const g = ctx.createRadialGradient(W / 2, H / 2, H * .3, W / 2, H / 2, H * .7);
      g.addColorStop(0, 'rgba(255,40,40,0)'); g.addColorStop(1, `rgba(255,40,40,${redFlash * .45})`);
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
    }
  }
  function drawHintHand(tgt, st) {
    const c = ((idle - st.hintDelay) % 1.3) / 1.3, appear = clamp01((idle - st.hintDelay) * 4);
    if (fits(tgt, S.piece)) drawPiece(S.piece, tgt.x, tgt.y, 1, (.3 + .2 * Math.sin(c * TAU)) * appear);
    let hx = tgt.x + 12, hy = tgt.y + 14, press = 0;
    if (c < .35) { const k = ease(c / .35); hx += (1 - k) * 34; hy += (1 - k) * 34; }
    else if (c < .6) press = (c - .35) / .25;
    else { const k = (c - .6) / .4; hx += easeIn(k) * 34; hy += easeIn(k) * 34; }
    drawHand(hx, hy, press, appear);
  }
  function wrap(text, maxW) {
    const words = text.split(' '), lines = []; let line = '';
    for (const w of words) { const tryL = line ? line + ' ' + w : w; if (ctx.measureText(tryL).width > maxW && line) { lines.push(line); line = w; } else line = tryL; }
    lines.push(line); return lines;
  }

  function render() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    if (scene === 'menu') renderMenu(); else renderGame();
    if (toast) {
      const a = Math.min(1, toast.age * 6, (1.6 - toast.age) * 4);
      ctx.save(); ctx.globalAlpha = a;
      ctx.font = '18px "Lilita One", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(toast.text).width + 36, y = scene === 'menu' ? 660 : 640;
      ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, y - 19, w, 38, 19); ctx.fillStyle = 'rgba(12,45,120,.85)'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(toast.text, W / 2, y + 1);
      ctx.restore();
    }
    if (fade) { ctx.fillStyle = `rgba(20,70,170,${fade})`; ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); render(); requestAnimationFrame(frame);
  }
  function boot(data) {
    // resume only a game that was mid-play in this same version; anything else starts at the menu
    if (data && data.S && data.S.v === VERSION && data.scene === 'game' && data.S.phase === 'play' && !data.S.piece?.hint) {
      S = data.S; scene = 'game'; S.piece = null; setTimeout(spawnPiece, 50);
    } else { S = newRun(); setupStageSilent(0); scene = 'menu'; }
    endEl.hidden = true; note = null;
  }
  function setupStageSilent(i) { const st = STAGES[i]; Object.assign(S, { stage: i, plates: makePlates(st), left: { ...st.goals }, combo: 0, script: 0, piece: null, pieceIn: 0, phase: 'in', phaseT: 0 }); }
  window.claude?.hot?.snapshot?.(() => ({ S, scene }));

  resize();
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
  Promise.all(Object.values(A).map(i => i.decode().catch(() => {}))).then(() => requestAnimationFrame(frame));
})();
</script>

</body>
