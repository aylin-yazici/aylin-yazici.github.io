<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Melon Plates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap">
<style>
  :root{
    color-scheme: light;
    --sky:#3EA5FD; --sky-light:#5BB8FF; --blue:#1E5FD8; --blue-deep:#154AB0;
    --cream:#FAE6D6; --sun:#FFC83A; --sun-deep:#E09A12;
  }
  html,body{height:100%}
  body{
    margin:0; overflow:hidden; user-select:none; -webkit-user-select:none;
    font-family:"Lilita One",system-ui,sans-serif; color:var(--blue);
    background-color:var(--sky);
    background-image:
      linear-gradient(45deg,var(--sky-light) 25%,transparent 25%,transparent 75%,var(--sky-light) 75%),
      linear-gradient(45deg,var(--sky-light) 25%,transparent 25%,transparent 75%,var(--sky-light) 75%);
    background-size:140px 140px; background-position:0 0,70px 70px;
  }
  #stage{position:relative;width:100%;height:100%;display:grid;place-items:center}
  #frame{position:relative;box-shadow:0 0 40px rgba(10,40,110,.35)}
  canvas{display:block;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
  #end{position:absolute;inset:0;display:grid;place-items:center;background:rgba(12,45,120,.5);padding-inline:16px}
  #end[hidden]{display:none}
  #end .card{
    background:var(--cream);border:6px solid var(--blue);border-radius:30px;
    padding:24px 22px 20px;text-align:center;width:min(300px,100%);
    box-shadow:0 10px 0 var(--blue-deep);animation:rise .45s cubic-bezier(.2,1.6,.4,1) both;
  }
  #end .fruit{display:flex;justify-content:center;gap:10px;height:40px;align-items:center}
  #end .fruit img{height:34px;width:auto}
  #end h2{font-weight:400;font-size:40px;line-height:1.05;margin:8px 0 6px;color:#fff;letter-spacing:1px;
    -webkit-text-stroke:7px var(--blue);paint-order:stroke fill;text-wrap:balance}
  #end.fail h2{-webkit-text-stroke-color:#C8322B}
  #end p{margin:0 0 18px;font-size:17px;color:var(--blue);text-wrap:balance}
  #primary{
    font-family:inherit;font-size:24px;letter-spacing:.5px;color:#fff;cursor:pointer;
    border:0;border-radius:20px;padding:14px 36px;background:#43C94B;box-shadow:0 6px 0 #22912B;
    -webkit-text-stroke:5px #1D7A25;paint-order:stroke fill;
  }
  #primary:active{transform:translateY(3px);box-shadow:0 3px 0 #22912B}
  #secondary{display:block;margin:12px auto 0;font-family:inherit;font-size:18px;color:var(--blue);background:none;border:0;cursor:pointer;padding:6px 12px}
  #primary:focus-visible,#secondary:focus-visible{outline:4px solid var(--blue);outline-offset:3px}
  @keyframes rise{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  @media (prefers-reduced-motion: reduce){#end .card{animation:none}}
</style>
</head>

  // ---------- loop ----------
  function update(dt) {

    sparks = sparks.filter(q => q.age < q.life);
    lockWiggle = lockWiggle.map(w => Math.max(0, w - dt * 2.5));
    if (S.piece) S.pieceIn = Math.min(1, S.pieceIn + dt * 4);
    if (fly && (fly.t += dt / .16) >= 1) { const f = fly; fly = null; land(f); }
    for (const p of S.plates) {

    }

      q.age += dt;

    }

        SFX.tick(f.i, Math.min(f.combo - 1, 3));

          sparks.push({ x: GOAL_X[f.fruit], y: GOAL_ICON_Y + 8, vx: Math.cos(a) * v, vy: Math.sin(a) * v, r: 5 + Math.random() * 4, age: 0, life: .5 + Math.random() * .3, rot: Math.random() * 3 }); }

  function renderMenu() {
    ctx.drawImage(A.menuBg, MENU_BG.x, MENU_BG.y, A.menuBg.width * MENU_BG.s, A.menuBg.height * MENU_BG.s);
    ctx.drawImage(A.topbar, TOPBAR.x, TOPBAR.y);
    const b = LEVEL_BTN, s = 1 - btnPress * .06;
    ctx.save(); ctx.translate(b.x + b.w / 2, b.y + b.h / 2); ctx.scale(s, s); ctx.drawImage(A.levelBtn, -b.w / 2, -b.h / 2); ctx.restore();
  }

  function renderGame() {
    drawBackground();
    drawHud();
    drawLocks();
    ctx.drawImage(A.gen, GEN_TL[0], GEN_TL[1]);
    S.plates.forEach(drawPlate);

    if (S.piece) {
      const s = back(S.pieceIn), wob = S.over === 'fail' ? Math.sin(t * 18) * .06 * Math.max(0, 1 - failT) : 0;
      ctx.save(); ctx.translate(GEN.x, GEN.y); ctx.scale(s, s); ctx.rotate(wob);
      drawPiece(S.piece, 0, 0);
      ctx.restore();
    }

    for (const q of particles) {
      const k = q.age / q.life;
      ctx.globalAlpha = 1 - k * k;
      if (q.kind === 'sprite') {
        const [sx, sy, sw, sh] = q.src;
        ctx.save(); ctx.translate(q.x, q.y); ctx.rotate(q.rot); ctx.scale(q.s, q.s);
        ctx.drawImage(A[q.sheet], sx, sy, sw, sh, -sw / 2, -sh / 2, sw, sh); ctx.restore();
      } else if (q.kind === 'wedge') { drawSlice(q.x, q.y, q.fruit, q.i, 1 - k * .4); }
      else if (q.kind === 'ring') { ctx.globalAlpha = (1 - k) * .85; ctx.beginPath(); ctx.arc(q.x, q.y, PLATE_R + ease(k) * 60, 0, TAU); ctx.strokeStyle = '#fff'; ctx.lineWidth = 9 * (1 - k); ctx.stroke(); }
      else if (q.kind === 'reward') drawReward(q, k);
      ctx.globalAlpha = 1;
    }

    for (const f of flyers) {
      if (f.t < 0) continue;
      const tx = GOAL_X[f.fruit], ty = GOAL_ICON_Y, im = A[ICONS[f.fruit]];
      const k = ease(f.t), cx = (f.x0 + tx) / 2 + (f.i - 2.5) * 28, cy = Math.min(f.y0, ty) - 60;
      const x = (1 - k) * (1 - k) * f.x0 + 2 * (1 - k) * k * cx + k * k * tx;
      const y = (1 - k) * (1 - k) * f.y0 + 2 * (1 - k) * k * cy + k * k * ty;
      ctx.save(); ctx.globalAlpha = .5; star(x, y + 6, 12 * (1 - k), k * 6, '#FFF3B0'); ctx.restore();
      ctx.save(); ctx.translate(x, y); ctx.rotate((1 - k) * 3); ctx.scale(1.4 - k * .4, 1.4 - k * .4); ctx.drawImage(im, -im.width / 2, -im.height / 2); ctx.restore();
    }
    for (const q of sparks) star(q.x, q.y, q.r * (1 - q.age / q.life), q.rot + q.age * 5);

    if (fly) {
      const k = ease(fly.t), a = Math.sin(k * Math.PI);
      const x = GEN.x + (fly.p.x - GEN.x) * k, y = GEN.y + (fly.p.y - GEN.y) * k - a * 25;
      ctx.save(); ctx.translate(x, y); ctx.scale(1 + a * .12, 1 + a * .12);
      ctx.shadowColor = 'rgba(10,40,110,.4)'; ctx.shadowOffsetY = 10; ctx.shadowBlur = 12;
      drawPiece(fly.piece, 0, 0);
      ctx.restore();
    }

    if (!S.taught && S.piece && S.pieceIn >= 1 && idle > .6) {
      const tgt = S.plates.find(p => fits(p, S.piece) && filled(p) + S.piece.size === 6) || S.plates.find(p => fits(p, S.piece));
      if (tgt) {
        const c = ((t - .6) % 1.4) / 1.4;
        drawPiece(S.piece, tgt.x, tgt.y, 1, .35 + .2 * Math.sin(c * TAU));
        const press = c < .3 ? c / .3 : 0, lift = c < .3 ? 0 : Math.sin((c - .3) / .7 * Math.PI) * 16;
        drawHand(tgt.x + 18, tgt.y + 20 + lift, press);
      }
    }

    if (S.over === 'fail') {                               // "no moves" banner before the dialog
      const k = Math.min(1, failT * 4);
      ctx.save(); ctx.fillStyle = `rgba(12,45,120,${.3 * k})`; ctx.fillRect(0, 0, W, H);
      ctx.translate(W / 2, GEN.y); ctx.scale(back(k), back(k));
      outlined('No moves left!', 0, 0, 40, '#fff', '#C8322B', '#7A1512');
      ctx.restore();
    }
  }

  function render() {
    ctx.setTransform(scale * dpr, 0, 0, scale * dpr, 0, 0);
    ctx.imageSmoothingQuality = 'high';
    if (scene === 'menu') renderMenu(); else renderGame();
    if (toast) {
      const a = Math.min(1, toast.age * 6, (1.6 - toast.age) * 4);
      ctx.save(); ctx.globalAlpha = a;
      ctx.font = '18px "Lilita One", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      const w = ctx.measureText(toast.text).width + 36, y = scene === 'menu' ? 660 : 706;
      ctx.beginPath(); ctx.roundRect(W / 2 - w / 2, y - 19, w, 38, 19); ctx.fillStyle = 'rgba(12,45,120,.85)'; ctx.fill();
      ctx.fillStyle = '#fff'; ctx.fillText(toast.text, W / 2, y + 1);
      ctx.restore();
    }
    if (fade) { ctx.fillStyle = `rgba(20,70,170,${fade})`; ctx.fillRect(0, 0, W, H); }
  }

  let last = performance.now();
  function frame(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    update(dt); render(); requestAnimationFrame(frame);
  }
  function layoutPlates() { S.plates.forEach((p, i) => { p.x = PLATE_TL[i][0] + MC[0]; p.y = PLATE_TL[i][1] + MC[1]; }); }
  function boot(data) {
    // only resume a saved game from this same version; positions always come from the Figma layout
    if (data && data.S && data.S.v === VERSION) { S = data.S; scene = data.scene || 'menu'; }
    else { S = freshState(); scene = 'menu'; }
    layoutPlates();
    endEl.hidden = true;
    if (scene === 'game' && S.over) showEnd(S.over);
  }
  window.claude?.hot?.snapshot?.(() => ({ S, scene }));

  resize();
  window.claude?.hot?.ready ? window.claude.hot.ready(boot) : boot(window.claude?.hot?.data ?? {});
  Promise.all(Object.values(A).map(i => i.decode().catch(() => {}))).then(() => requestAnimationFrame(frame));
})();
</script>

</body>
